spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema changes are managed by Flyway; use the dev profile only if you intentionally need Hibernate update.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8080}

# JWT configuration is bound by a custom @ConfigurationProperties(prefix = "jwt") bean.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# Gửi email qua Brevo API (HTTPS) — không dùng cổng SMTP thô nên không bị các
# nhà mạng/hosting chặn cổng. Chỉ cần verify 1 email gửi (không cần domain
# riêng) trên app.brevo.com, tạo API key ở mục "SMTP & API" > "API Keys".
brevo:
  api-key: ${BREVO_API_KEY}

app:
  auth:
    # false for local HTTP development; set true behind HTTPS in production.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  sample-data:
    # Set APP_SAMPLE_DATA_RESET_ON_START=true once to clear business data, retain ADMIN accounts, and load demo data.
    reset-on-start: ${APP_SAMPLE_DATA_RESET_ON_START:false}
  mail:
    # Phải trùng với email đã verify (Senders) trên tài khoản Brevo của bạn.
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:ForestView Homestay}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}