spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema changes are managed by Flyway; use the dev profile only if you intentionally need Hibernate update.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Gửi email qua SMTP (mặc định cấu hình cho Gmail — miễn phí, không cần
  # verify domain, gửi được tới bất kỳ ai). MAIL_USERNAME phải là địa chỉ Gmail
  # đầy đủ, MAIL_APP_PASSWORD là "App Password" 16 ký tự (KHÔNG phải mật khẩu
  # Gmail thường) — tạo tại https://myaccount.google.com/apppasswords
  # (yêu cầu tài khoản Google đã bật xác minh 2 bước).
  # Muốn dùng SMTP khác (Outlook, công ty riêng...) chỉ cần đổi 3 biến môi
  # trường MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_APP_PASSWORD tương ứng.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
server:
  port: ${PORT:8080}

# JWT configuration is bound by a custom @ConfigurationProperties(prefix = "jwt") bean.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

app:
  auth:
    # false for local HTTP development; set true behind HTTPS in production.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  sample-data:
    # Set APP_SAMPLE_DATA_RESET_ON_START=true once to clear business data, retain ADMIN accounts, and load demo data.
    reset-on-start: ${APP_SAMPLE_DATA_RESET_ON_START:false}
  mail:
    # Gmail chỉ cho gửi với "from" trùng với MAIL_USERNAME đã xác thực, nên mặc
    # định lấy luôn MAIL_USERNAME làm địa chỉ gửi.
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    from-name: ${MAIL_FROM_NAME:ForestView Homestay}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}