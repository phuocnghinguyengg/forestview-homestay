jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-make-it-long}
  access-token-expiration: 3600000      # 1 giờ
  refresh-token-expiration: 604800000   # 7 ngày

cors:
  allowed-origins: http://localhost:3000

